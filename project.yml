name: Polso
options:
  bundleIdPrefix: com.thomasaddamo
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 5529J57UL4
    CODE_SIGN_STYLE: Automatic
targets:
  Polso:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Polso
        UILaunchScreen: {}
        NSCameraUsageDescription: Polso usa la fotocamera per scattare foto da inviare a Claude.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasaddamo.polso
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PolsoWatch
  PolsoWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Polso
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.thomasaddamo.polso
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasaddamo.polso.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PolsoWatchWidget
  PolsoWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [WatchWidget]
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Polso
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasaddamo.polso.watchkitapp.widget
